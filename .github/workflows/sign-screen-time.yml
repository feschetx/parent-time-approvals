name: Sign local Screen Time probe
on:
  push:
    branches: [main]
    paths:
      - tools/screen-time/**
      - .github/workflows/sign-screen-time.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build reviewed local-only probe
        run: python3 tools/screen-time/build_probe.py build
      - name: Sign with Apple's native tool
        run: shortcuts sign --mode anyone --input build/Screen-Time-Setup-Check.unsigned.shortcut --output build/Screen-Time-Setup-Check.shortcut
      - name: Preserve signed file and review source
        uses: actions/upload-artifact@v4
        with:
          name: screen-time-setup-check
          path: build/
          retention-days: 7
